[build-system]
requires = ["setuptools>=61.0", "wheel", "grpcio-tools>=1.50"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbus-proto"
version = "0.1.1"
requires-python = ">=3.11"
license = {text = "MIT"}
description = "Generated protobuf bindings for AgentBus and AppServer"
dependencies = [
    "protobuf>=4.0",
    "grpcio>=1.80.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentbus_proto*", "appserver_proto*"]
