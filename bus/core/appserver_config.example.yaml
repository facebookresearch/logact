# Example AppServer config file.
# Usage: agentbus_app_server --agentbus memory:// --config appserver_config.yaml

bus_id: my-bus

# All intervals are in milliseconds.
gate_check_timeout_ms: 30000
decider_poll_interval_ms: 100
voter_poll_interval_ms: 100
mailbox_poll_interval_ms: 100

voters:
  # LLM-based voter: calls an OpenAI-compatible endpoint.
  # model and api_endpoint are optional — defaults come from LLM_MODEL and
  # LLM_API_ENDPOINT env vars, or built-in defaults (Llama 3.3 70B).
  # API key is always read from the LLM_API_KEY env var.
  - type: llm
    prompt_override: "Be extra cautious with network operations."
    model: Llama-3.3-70B-Instruct
    api_endpoint: https://api.llama.com/experimental/compat/openai/v1

  # Rule-based voter: pattern-matching allow/deny rules.
  # Rules are evaluated in order. First matching deny wins; if no deny
  # matches, first matching allow wins. No match → default deny.
  - type: rule-based
    rules:
      - pattern: "rm -rf"
        action: deny
        match_type: substring
        reason: "destructive command"
      - pattern: "echo"
        action: allow
        match_type: substring
        reason: "safe output command"
