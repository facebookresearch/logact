syntax = "proto3";

package logact_commit_service_policy;

import "agentbus_proto/agent_bus.proto";

// Complete desired policy for one commit-service bus.
message PolicyState {
  optional agent_bus.DeciderPolicy decider_policy = 1;
  map<string, agent_bus.VoterConfig> voters = 2;
}
