name: macOS package and release

on:
  workflow_call:
    inputs:
      publish_stable:
        description: Publish a stable release for the checked-in marketplace version
        required: false
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    # GitHub does not evaluate path filters for tag pushes.
    paths:
      - ".github/workflows/macos-release.yml"
      - ".claude-plugin/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "bus/**"
      - "INSTALL.md"
      - "LICENSE"
      - "logact/**"
      - "plugins/**"
      - "README.md"
      - "scripts/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/macos-release.yml"
      - ".claude-plugin/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "bus/**"
      - "INSTALL.md"
      - "LICENSE"
      - "logact/**"
      - "plugins/**"
      - "README.md"
      - "scripts/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      package_version: ${{ steps.package.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Validate manual release source
      if: inputs.publish_stable
      run: |
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "stable releases must be dispatched from main" >&2
          exit 1
        fi
        python3 - <<'PY'
        import json

        manifests = {
            "marketplace": ".claude-plugin/marketplace.json",
            "Claude plugin": "plugins/logact-oss/.claude-plugin/plugin.json",
            "Codex plugin": "plugins/logact-oss/.codex-plugin/plugin.json",
            "Muse plugin": "plugins/logact-oss/.muse-plugin/plugin.json",
        }
        documents = {
            name: json.load(open(path)) for name, path in manifests.items()
        }
        expected = documents["marketplace"]["metadata"]["version"]
        versions = {
            name: document["metadata"]["version"]
            if name == "marketplace"
            else document["version"]
            for name, document in documents.items()
        }
        versions["marketplace plugin"] = documents["marketplace"]["plugins"][0]["version"]
        mismatches = {
            name: version for name, version in versions.items() if version != expected
        }
        if mismatches:
            raise SystemExit(f"release versions do not match {expected}: {mismatches}")
        if "-" in expected:
            raise SystemExit(f"stable release version contains a prerelease suffix: {expected}")
        PY
    - name: Resolve and fetch Cargo dependencies
      run: |
        # The repository does not check in Cargo.lock yet. Resolve once, then
        # keep all subsequent dependency operations locked to that file.
        cargo generate-lockfile
        cargo fetch --locked
    - name: Build Apple Silicon binaries
      run: |
        export LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
        rustup target add aarch64-apple-darwin
        cargo build --release --locked \
          --target aarch64-apple-darwin \
          --package agentbus_cli_lib \
          --bin agentbus_cli
        cargo build --release --locked \
          --target aarch64-apple-darwin \
          --package logact_commit_cli_lib \
          --bin logact_commit_cli
        cargo build --release --locked \
          --target aarch64-apple-darwin \
          --package logact_local_server_lib \
          --bin logact_local_server
    - name: Package
      id: package
      run: |
        base_version="$(python3 -c 'import json; print(json.load(open(".claude-plugin/marketplace.json"))["metadata"]["version"])')"
        if [ "${{ inputs.publish_stable }}" = "true" ]; then
          package_version="$base_version"
        elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
          package_version="${GITHUB_REF_NAME#v}"
          case "$package_version" in
            "$base_version"|"$base_version"-*) ;;
            *)
              echo "tag version $package_version does not match marketplace version $base_version" >&2
              exit 1
              ;;
          esac
        else
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          package_version="$base_version-$short_sha"
        fi
        echo "LOGACT_PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
        echo "version=$package_version" >> "$GITHUB_OUTPUT"
        LOGACT_BINARY_DIR="$PWD/target/aarch64-apple-darwin/release" \
          LOGACT_DIST_DIR="$PWD/dist" \
          LOGACT_PACKAGE_PLATFORM=macos \
          LOGACT_PACKAGE_ARCH=arm64 \
          ./scripts/package-release.sh "$package_version"
    - name: Test package installer
      run: ./scripts/test-package-installer.sh dist
    - name: Test release downloader
      run: |
        work_dir="$(mktemp -d)"
        mkdir -p "$work_dir/home"
        LOGACT_RELEASE_BASE_URL="file://$PWD/dist" \
          LOGACT_TEST_SKIP_LAUNCHCTL=1 \
          HOME="$work_dir/home" \
          ./scripts/install-release.sh \
          --version "$LOGACT_PACKAGE_VERSION"
        install_prefix="$work_dir/home/.local"
        test -x "$install_prefix/bin/logact-oss-hook"
        LOGACT_TEST_SKIP_LAUNCHCTL=1 HOME="$work_dir/home" \
          "$install_prefix/share/logact-oss/uninstall.sh"
        test ! -e "$install_prefix/bin/logact-oss-hook"
    - name: Upload package artifact
      uses: actions/upload-artifact@v5
      with:
        name: logact-macos
        path: dist/*
        if-no-files-found: error
        retention-days: 14

  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      inputs.publish_stable
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Resolve release tag
      env:
        PACKAGE_VERSION: ${{ needs.package.outputs.package_version }}
        PUBLISH_STABLE: ${{ inputs.publish_stable }}
      run: |
        if [ "$PUBLISH_STABLE" = "true" ]; then
          release_tag="v$PACKAGE_VERSION"
          remote_refs="$(git ls-remote origin \
            "refs/tags/$release_tag" \
            "refs/tags/$release_tag^{}")"
          remote_commit="$(printf '%s\n' "$remote_refs" | awk '
            $2 ~ /\^\{\}$/ { peeled = $1 }
            $2 !~ /\^\{\}$/ { direct = $1 }
            END { print peeled ? peeled : direct }
          ')"
          if [ -z "$remote_commit" ]; then
            git push origin "$GITHUB_SHA:refs/tags/$release_tag"
          elif [ "$remote_commit" != "$GITHUB_SHA" ]; then
            echo "$release_tag already points to $remote_commit, not $GITHUB_SHA" >&2
            exit 1
          fi
        else
          release_tag="$GITHUB_REF_NAME"
        fi
        echo "LOGACT_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
    - name: Download packaged artifacts
      uses: actions/download-artifact@v5
      with:
        name: logact-macos
        path: dist
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: ./scripts/publish-github-release.sh "$LOGACT_RELEASE_TAG" dist
